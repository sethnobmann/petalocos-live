name: tuesday roll

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week to roll (blank = last completed week)"
        required: false
  schedule:
    - cron: "0 14 * * 2"   # Tuesday 7am PDT / 6am PST

permissions:
  contents: write

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Roll last week into weekly_scores_2026.csv
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python scripts/roll_week.py ${{ github.event.inputs.week }}
      - name: Refresh live.json too
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python scripts/fetch_live.py
      - name: Commit
        run: |
          git config user.name "petalocos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/weekly_scores_2026.csv docs/live.json
          git diff --cached --quiet || git commit -m "roll: $(date -u +%Y-%m-%d)"
          git push
