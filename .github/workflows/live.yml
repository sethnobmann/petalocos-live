name: live scores

on:
  workflow_dispatch:
  schedule:
    # Game windows only, every 10 min. Cron is UTC; windows are padded so they
    # cover both PDT (UTC-7) and PST (UTC-8).
    - cron: "*/10 0-5 * * 5"    # Thu night game (Fri 00:00-05:59 UTC)
    - cron: "*/10 13-23 * * 0"  # Sunday from the early London kick through the late game
    - cron: "*/10 0-5 * * 1"    # Sunday night game spill (Mon UTC)
    - cron: "*/10 0-5 * * 2"    # Monday night game (Tue UTC)

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch live scores
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python scripts/fetch_live.py
      - name: Commit live.json
        run: |
          git config user.name "petalocos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/live.json
          git diff --cached --quiet || git commit -m "live: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
